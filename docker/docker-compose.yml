# Self-host Movara: Postgres 16 + web (:3000) + standalone MCP server (:3333).
#   cp docker/.env.example docker/.env   # edit secrets
#   docker compose -f docker/docker-compose.yml --env-file docker/.env up -d --build
name: movara

x-app-env: &app-env
  DATABASE_URL: postgres://${POSTGRES_USER:-movara}:${POSTGRES_PASSWORD:-movara}@postgres:5432/${POSTGRES_DB:-movara}
  MOVARA_SEED_DEMO: ${MOVARA_SEED_DEMO:-0}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-movara}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-movara}
      POSTGRES_DB: ${POSTGRES_DB:-movara}
    volumes:
      - movara-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: applies migrations (and seeds the demo org when MOVARA_SEED_DEMO=1), then exits.
  migrate:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      target: builder # full workspace (tsx + pnpm scripts); the runtime image is standalone-only
    image: movara-web-migrate:local
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *app-env
    working_dir: /app
    command:
      - sh
      - -c
      - |
        if [ "$${MOVARA_SEED_DEMO}" = "1" ]; then pnpm db:seed; else pnpm db:migrate; fi

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    image: movara-web:local
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *app-env
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in docker/.env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      APP_URL: ${APP_URL:-http://localhost:3000}
      MOVARA_TERMINOLOGY_PACKS: ${MOVARA_TERMINOLOGY_PACKS:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    ports:
      - "${WEB_PORT:-3000}:3000"

  mcp:
    build:
      context: ..
      dockerfile: docker/Dockerfile.mcp
    image: movara-mcp:local
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *app-env
      PORT: "3333"
      MOVARA_TERMINOLOGY_PACKS: ${MOVARA_TERMINOLOGY_PACKS:-}
    ports:
      - "${MCP_PORT:-3333}:3333"

volumes:
  movara-pgdata:
